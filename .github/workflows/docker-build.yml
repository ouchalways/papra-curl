name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'latest-version.txt'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare image metadata
        id: meta
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -f latest-version.txt ] && [ -s latest-version.txt ]; then
            TAG=$(tr -d '[:space:]' < latest-version.txt)
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "repo_owner=$REPO_OWNER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_owner }}/papra-with-curl:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo_owner }}/papra-with-curl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
